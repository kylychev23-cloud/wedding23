<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Приглашение на свадьбу — Аскат & Гулбара</title>
    <!-- Подключение элегантных шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #FAF8F5;
            --bg-card: #FFFFFF;
            --gold-primary: #C5A059;
            --gold-light: #E6D5B8;
            --gold-dark: #9A7B3E;
            --text-main: #333333;
            --text-muted: #7A7A7A;
            --sage-accent: #8A9A86;
            --sage-light: #F2F5F1;
            --border-color: #E8E2D8;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 15px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- ЭКРАН С 3D КОНВЕРТОМ --- */
        #envelope-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #FCFBF9 0%, #EDE6DC 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            cursor: pointer;
            perspective: 1000px;
            padding: 20px;
        }

        #envelope-overlay.opened {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .envelope-container {
            position: relative;
            width: 320px;
            height: 220px;
            background: #FDFBF7;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #EAE3D2;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 120px solid #F7F2E7;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .envelope-overlay.opened .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-seal {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: radial-gradient(circle, #D4AF37 0%, #AA7C11 100%);
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(170, 124, 17, 0.35), inset 0 2px 4px rgba(255,255,255,0.4);
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #FFF8E7;
            transition: transform 0.4s ease;
        }

        .seal-monogram {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .botanical-decor {
            position: absolute;
            width: 140px;
            height: 140px;
            pointer-events: none;
            opacity: 0.6;
        }

        .botanical-decor.top-left { top: -20px; left: -20px; }
        .botanical-decor.bottom-right { bottom: -20px; right: -20px; transform: rotate(180deg); }

        .envelope-hint {
            margin-top: 40px;
            font-family: var(--font-sans);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-dark);
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.6; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-4px); }
        }

        /* --- КНОПКА МУЗЫКИ --- */
        .music-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--gold-light);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .music-toggle.playing {
            border-color: var(--gold-primary);
            animation: rotateMusic 10s linear infinite;
        }

        @keyframes rotateMusic {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-icon {
            width: 20px;
            height: 20px;
            fill: var(--gold-dark);
        }

        /* --- ОСНОВНОЙ КОНТЕЙНЕР СТРАНИЦЫ --- */
        .main-wrapper {
            max-width: 540px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            position: relative;
        }

        .section-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px 24px;
            margin-top: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            border: 1px solid var(--border-color);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* --- ЭКРАН HERO --- */
        .hero-section {
            padding-top: 50px;
            padding-bottom: 40px;
            background: linear-gradient(180deg, #FFFFFF 0%, #FAF8F5 100%);
        }

        .monogram-badge {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px auto;
            border: 1px solid var(--gold-primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #FFFDF9;
        }

        .monogram-badge::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 1px dashed var(--gold-light);
            border-radius: 50%;
        }

        .monogram-text {
            font-family: var(--font-serif);
            font-size: 28px;
            color: var(--gold-dark);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .wedding-title {
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .couple-names {
            font-family: var(--font-serif);
            font-size: 42px;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .couple-names span {
            display: block;
            font-size: 26px;
            color: var(--gold-primary);
            margin: 4px 0;
            font-style: italic;
        }

        .wedding-date-header {
            font-family: var(--font-serif);
            font-size: 20px;
            color: var(--gold-dark);
            letter-spacing: 1px;
            margin-top: 8px;
        }

        /* --- ОБРАЩЕНИЕ --- */
        .message-title {
            font-family: var(--font-serif);
            font-size: 28px;
            color: var(--text-main);
            margin-bottom: 16px;
            font-weight: 400;
        }

        .message-body {
            font-size: 15px;
            color: #555555;
            line-height: 1.8;
            font-weight: 300;
        }

        /* --- КАЛЕНДАРЬ --- */
        .calendar-container {
            margin-top: 20px;
        }

        .calendar-month {
            font-family: var(--font-serif);
            font-size: 22px;
            color: var(--gold-dark);
            margin-bottom: 16px;
            text-transform: capitalize;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            max-width: 300px;
            margin: 0 auto;
        }

        .day-name {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
            padding-bottom: 8px;
        }

        .day-num {
            font-size: 14px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            color: #444;
        }

        .day-num.wedding-day {
            background: var(--gold-primary);
            color: #FFFFFF;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.4);
            position: relative;
        }

        .day-num.wedding-day::after {
            content: '♥';
            position: absolute;
            top: -6px;
            right: -2px;
            font-size: 10px;
            color: var(--gold-dark);
        }

        /* --- ЛОКАЦИЯ И ВРЕМЯ --- */
        .venue-name {
            font-family: var(--font-serif);
            font-size: 26px;
            color: var(--gold-dark);
            margin-bottom: 8px;
        }

        .venue-address {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .time-badge {
            display: inline-block;
            padding: 8px 20px;
            background: var(--sage-light);
            color: var(--sage-accent);
            border-radius: 20px;
